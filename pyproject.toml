[project]
name = "movie-recommender"
version = "1.0.0"
description = "User-based collaborative filtering movie recommender system"
authors = [{name = "Rishabh Rising", email = "rishabh.rising@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["machine-learning", "recommender-systems", "collaborative-filtering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=1.5.0,<2.0.0",
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.9.0,<2.0.0",
    "scikit-learn>=1.1.0,<2.0.0",
    "fastapi>=0.85.0,<1.0.0",
    "uvicorn[standard]>=0.18.0,<1.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/rishabhrising/ASSIGNMENT_RS"
Repository = "https://github.com/rishabhrising/ASSIGNMENT_RS.git"

[project.scripts]
recommend-demo = "example_usage:main"
evaluate-movielens = "scripts.evaluate_movielens:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]